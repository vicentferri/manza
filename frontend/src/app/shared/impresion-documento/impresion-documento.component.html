<ul class="nav nav-tabs impresion-pestanas" *ngIf="pestanas.length > 1">
  <li class="nav-item" *ngFor="let p of pestanas">
    <a class="nav-link" href="javascript:void(0)" [class.active]="activa === p.clave" (click)="activa = p.clave">
      {{ p.titulo | translate }}
    </a>
  </li>
</ul>

<div class="impresion-cargando" *ngIf="cargando && pestanas.length === 0">
  <i class="fa fa-spinner fa-spin"></i>&nbsp;{{ "CARGANDO" | translate }}
</div>

<ng-container *ngFor="let p of pestanas">
  <div [hidden]="activa !== p.clave">
    <div class="impresion-cargando" *ngIf="!p.url && !p.error">
      <i class="fa fa-spinner fa-spin"></i>&nbsp;{{ "GENERANDO DOCUMENTO" | translate }}
    </div>
    <div class="alert alert-danger" *ngIf="p.error">
      {{ p.textoError | translate }}
    </div>
    <div class="impresion-descarga" *ngIf="p.descarga">
      <a class="btn btn-sm btn-outline-secondary" [href]="p.descarga" [download]="p.nombreFichero">
        <i class="fa fa-download"></i>&nbsp;{{ "DESCARGAR" | translate }} {{ p.nombreFichero }}
      </a>
    </div>
    <iframe *ngIf="p.url" class="impresion-visor" frameborder="0" [src]="p.url"></iframe>
  </div>
</ng-container>
