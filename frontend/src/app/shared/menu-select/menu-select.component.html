<div class="row">

	<div class="col col-6" *ngFor="let item of menuItems">

		<div class="callout callout-warning m-0 py-3 mt-2">
				<div class="row">
					<div class="col col-2 avatar justified_center_center">
						<img src="assets/images/avatars/7.jpg" class="img-avatar">
					</div>
					<div class="col col-10">
						<div>{{item.Label}}</div>
	          			<small class="text-muted mr-3"><i class="icon-calendar"></i>{{item.C1}}</small>
	          			<small class="text-muted mr-3 float-right"><i class="icon-location-pin"></i>{{item.PVP}}&nbsp;€</small>
				    </div>
				</div>
    	</div>

	</div>

</div>
