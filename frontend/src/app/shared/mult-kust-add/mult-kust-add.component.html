<div class="row">
  <div class="form-group col col-4">
    <label>Selección de Cliente</label>
    <div class="input-group">
      <select
        class="form-control"
        id="cliente"
        required
        #SelectedCliente
        [(ngModel)]="cliente"
        [ngModelOptions]="{ standalone: true }"
        (change)="ChangeCliente($event)"
      >
        <option *ngFor="let pow of clientes" [value]="pow.idrow">
          {{ pow.descripcion }}
        </option>
      </select>
      <span class="input-group-btn">
        <button class="btn btn-primary btn-block" (click)="add()">
          Agregar a Cliente
        </button>
      </span>
    </div>
  </div>
</div>
