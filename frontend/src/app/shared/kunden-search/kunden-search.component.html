<div class="row">
    <div class="form-group col-xs-2 col-md-2 col-lg-2">
        <label form="pais">País</label>
        <select class="form-control form-control-sm" id="tipo" required [(ngModel)]="searchcliente.pais" [ngModelOptions]="{standalone: true}"
            (change)="loadProvincias()">
            <option *ngFor="let pow of paises" [value]="pow.uid">{{pow.descripcion}}</option>
        </select>
    </div>

    <div class="form-group col-xs-2 col-md-2 col-lg-2">
        <label form="provincia">Província</label>
        <select class="form-control form-control-sm" id="tipo" required [(ngModel)]="searchcliente.provincia" [ngModelOptions]="{standalone: true}">
            <option *ngFor="let pow of provincias" [value]="pow.uid">{{pow.descripcion}}</option>
        </select>
    </div>
    
    <div class="form-group col-xs-2 col-md-2 col-lg-2">
        <label form="cadena">Cadena</label>
        <select class="form-control form-control-sm" id="tipo" required #SelectedCadena
                [(ngModel)]="searchcliente.cadena"
                [ngModelOptions]="{standalone: true}">
                <option *ngFor="let pow of cadena" [value]="pow.uid">{{pow.descripcion}}</option>
        </select>
    </div>

    <div class="form-group col-xs-2 col-md-2 col-lg-2">
        <label form="gestion">Gestión</label>
        <select class="form-control form-control-sm" id="tipo" required #SelectedTipo
                [(ngModel)]="searchcliente.gestion"
                [ngModelOptions]="{standalone: true}">
                <option *ngFor="let pow of gestion" [value]="pow.uid">{{pow.descripcion}}</option>
        </select>
    </div>

    <div class="form-group col-xs-2 col-md-2 col-lg-2">
        <label form="actividad">Actividad</label>
        <select class="form-control form-control-sm" id="tipo" required #SelectedTipo
                [(ngModel)]="searchcliente.actividad"
                [ngModelOptions]="{standalone: true}">
                <option *ngFor="let pow of actividad" [value]="pow.uid">{{pow.descripcion}}</option>
        </select>
    </div>

    <div class="form-group col-xs-2 col-md-2 col-lg-2">
        <label form="sector">Sector</label>
        <select class="form-control form-control-sm" id="tipo" required #SelectedTipo
                [(ngModel)]="searchcliente.sector"
                [ngModelOptions]="{standalone: true}">
                <option *ngFor="let pow of sector" [value]="pow.uid">{{pow.descripcion}}</option>
        </select>
    </div>

    <div class="form-group col-xs-12 col-md-12 col-lg-12">
        <label>Criterio de Búsqueda</label>
        <div class="input-group">
              <input type="text" class="form-control input-sm form-control-sm"
                     [ngModelOptions]="{standalone: true}"
                     [(ngModel)]="searchcliente.criterio"  (keyup.enter)="search()">
                     <span class="input-group-btn">
                  <button type="button" (click)="search()" class="btn btn-primary btn-sm" title="Buscar" data-toggle="tooltip" data-placement="top">&nbsp;Buscar
                  </button>
              </span>
              <span class="input-group-btn" *ngIf="MultipleSelection==true"> 
                    <button class="btn  btn-primary btn-block btn-sm"  
                    (click)="Select();">Seleccionar</button>
              </span>
          </div>
    </div>

   
    <div class="col-lg-12">
        <div>{{searchResults.length}}&nbsp;Encontrados</div>
        <div style="height:405px;overflow:auto">
            
            <div class="table-responsive" style="border:1px dashed silver;height:400px">
              <table class="table table-striped table-bordered table-condensed">
                <thead class="bg-primary">
                      <tr>
                          <th style="cursor:hand;width:20px"></th>
                          <th >Número</th>
                          <th >Cliente</th>
                          <th >Domicilio</th>
                          <th >Poblacion</th>
                      </tr>
                  </thead>
                  <tbody>
                       <tr *ngFor="let item of searchResults">
                           <td style="cursor:hand;width:20px" *ngIf="MultipleSelection==true">
                                <input type="checkbox" [checked]="item.selected" (change)="customer_changed($event,item);">
                           </td>
                           <td style="cursor:hand;width:20px" *ngIf="MultipleSelection==false">
                            <button class="btn btn-sm" type="button"><i class="fa fa-paperclip" (click)="selectCustomer(item);"></i>
                            </button></td>
                           <td>{{item.numero}}</td>
                           <td>{{item.nombre}}</td>
                           <td>{{item.nombre_domicilio}}</td>
                           <td>{{item.poblacion_domicilio}}</td>
                       </tr>
                  </tbody>
              </table>
          </div>
        </div>
    </div>
</div>
