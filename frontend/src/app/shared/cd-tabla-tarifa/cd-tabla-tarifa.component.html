<div *ngIf="cargando" class="text-muted p-2"><i class="fa fa-spinner fa-spin mr-1"></i>Cargando tabla...</div>
<div *ngIf="error" class="alert alert-danger py-1 mb-0">{{ error }}</div>

<div *ngIf="tabla">
  <div class="mb-2">
    <strong>{{ tabla.titulo }}</strong>
    <span class="text-muted ml-2">Hoja {{ tabla.hoja }}</span>
    <span class="text-muted ml-2" *ngIf="ancho !== null && alto !== null">· celda ancho {{ ancho | number:'1.2-2' }} × alto {{ alto | number:'1.2-2' }} m</span>
  </div>
  <div class="tabla-scroll">
    <table class="table table-sm table-bordered mb-0 matriz">
      <thead>
        <tr>
          <th class="esquina">Alto \ Ancho (m)</th>
          <th *ngFor="let a of anchos" [class.marcada]="esColumna(a)">{{ a | number:'1.1-2' }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let f of filas">
          <th [class.marcada]="esFila(f.alto)">{{ f.alto | number:'1.1-2' }}</th>
          <td *ngFor="let p of f.precios; let i = index"
              [class.cruce]="esFila(f.alto) || esColumna(anchos[i])"
              [class.celda]="esFila(f.alto) && esColumna(anchos[i])">
            {{ p === null ? '' : (p | number:'1.2-2') }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
