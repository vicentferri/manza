            

<div>
    <div class="row">
        <div class="col col-md-12">
            <jqxGrid #gridReference [auto-create]='false'  ></jqxGrid> 
        </div>
    </div>

    <div class="row mt-2">
        <div class="col col-lg-4">

        </div>
        <div class="col col-lg-2">

        </div>
        <div class="col col-lg-2">

        </div>
        <div class="col col-lg-2">
            <button class="btn  btn-primary btn-block" (click)="staticModal.show();Edit();">Editar</button>
        </div>
        <div class="col col-lg-2">
            <button class="btn  btn-primary btn-block" (click)="refresh();">Refrescar</button>
        </div>
    </div>
</div>

<div class="modal fade" bsModal #staticModal="bs-modal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
     <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header bg-primary">
                <h4 class="modal-title pull-left">Detalle de Linea</h4>
                <button type="button" class="close pull-right" aria-label="Close" (click)="staticModal.hide()">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">

                <form [formGroup]="formGroup">
                    <dynamic-bootstrap-form [group]="formGroup" [model]="formModel"></dynamic-bootstrap-form>
                </form>

            </div>
            <div class="modal-footer">
                <button class="btn btn-primary " (click)="staticModal.hide();myGrid.clearselection();">Cerrar</button>
                <button class="btn btn-primary " (click)="Update();staticModal.hide();">Actualizar</button>
            </div>
        </div>
    </div>
</div>
