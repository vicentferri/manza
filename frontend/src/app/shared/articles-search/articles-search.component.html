<div class="row">
  <div class="form-group col-lg-3">
    <label>Alias</label>
    <input
      type="text"
      class="form-control form-control-sm"
      [(ngModel)]="searchArticle.Alias"
    />
  </div>
  <div class="form-group col-lg-3">
    <label>Barras</label>
    <input
      type="text"
      class="form-control form-control-sm"
      [(ngModel)]="searchArticle.Barras"
    />
  </div>
  <div class="form-group col-lg-6">
    <label>Descripción</label>
    <div class="input-group">
      <input
        type="text"
        class="form-control form-control-sm"
        [(ngModel)]="searchArticle.Descripcion"
        (keyup.enter)="searchLines()"
      />
      <span class="input-group-btn">
        <button
          type="button"
          (click)="searchLines()"
          class="btn btn-primary btn-sm"
          title="Buscar"
          data-toggle="tooltip"
          data-placement="bottom"
        >
          Buscar
        </button>
      </span>
    </div>
  </div>
  <div class="col-lg-12" style="height: 600px">
    <div style="height: 550px; overflow: auto">
      <div class="table-responsive">
        <table class="table table-striped table-bordered table-condensed">
          <thead class="bg-primary">
            <tr>
              <th>Alias</th>
              <th>Artículo</th>
              <th>Cantidad</th>
              <th>Ud</th>
              <th>UdsCaja</th>
              <th>Cajas</th>
              <th>Stock</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of Lines">
              <td>{{ item.Alias }}</td>
              <td>{{ item.Descripcion }}</td>
              <td>
                <input
                  type="number"
                  id="Pdte"
                  style="width: 75px"
                  [(ngModel)]="item.cantidad_sel"
                />
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="pull-right">
      <button
        type="button"
        (click)="addLines()"
        class="btn btn-primary btn-sm"
        title="Agregar"
        data-toggle="tooltip"
        data-placement="top"
      >
        Agregar
      </button>
    </div>
  </div>
</div>
