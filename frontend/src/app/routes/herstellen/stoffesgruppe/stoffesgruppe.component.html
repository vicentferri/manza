<div class="container">
  <div class="row">
    <div class="col col-12 card-middle">
      <h6>
        Tejidos y Grupos
        <div class="pull-right">
          <button
            style="margin-right: 5px"
            class="btn btn-sm btn-secondary"
            title="Asignar los tejidos seleccionados a un grupo"
            (click)="AsignarTejidos()"
          >
            <i class="fa fa-link"></i> Asignar a grupo
          </button>
          <button
            style="margin-right: 15px"
            class="btn btn-sm btn-secondary"
            title="Quitar los tejidos seleccionados de su grupo"
            (click)="QuitarTejidos()"
          >
            <i class="fa fa-unlink"></i> Quitar del grupo
          </button>
          <button
            style="margin-right: 5px"
            class="btn btn-sm btn-secondary"
            title="Editar / borrar grupo"
            (click)="EditGrupo()"
          >
            <i class="fa fa-edit"></i>
          </button>
          <button
            class="btn btn-sm btn-secondary"
            title="Nuevo grupo"
            (click)="AddGrupo()"
          >
            <i class="fa fa-plus"></i>
          </button>
        </div>
      </h6>
      <div style="height: 700px; margin-top: 2px">
        <jqxGrid #gridReference [auto-create]="false"></jqxGrid>
      </div>
    </div>
  </div>
</div>

<div
  class="modal fade"
  bsModal
  #staticModalAdd="bs-modal"
  tabindex="-1"
  role="dialog"
  aria-labelledby="myModalLabel"
  aria-hidden="true"
  id="docModalDet"
>
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-body">
        <div class="row">
          <div class="col col-12">
            <label>Grupo a editar</label>
            <select
              class="form-control form-control-sm"
              [ngModel]="model.idrow"
              (ngModelChange)="SelectGrupo($event)"
              [ngModelOptions]="{ standalone: true }"
            >
              <option [ngValue]="0">— Nuevo grupo —</option>
              <option *ngFor="let g of grupos" [ngValue]="g.idrow">
                {{ g.grupo }} - {{ g.descripcion }}
              </option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="col col-4">
            <label>Grupo</label>
            <input
              class="form-control form-control-sm"
              [(ngModel)]="model.grupo"
            />
          </div>
          <div class="col col-8">
            <label>Descripción</label>
            <input
              class="form-control form-control-sm"
              [(ngModel)]="model.descripcion"
            />
          </div>
        </div>
        <div class="row">
          <div class="col col-4">
            <label>Precio</label>
            <input
              class="form-control form-control-sm"
              [(ngModel)]="model.precio"
              type="number"
            />
          </div>
          <div class="col col-8">
            <label>Criterio</label>
            <select
              class="form-control form-control-sm"
              id="cliente"
              required
              [(ngModel)]="model.criterio"
              [ngModelOptions]="{ standalone: true }"
            >
              <option *ngFor="let pow of lista_criterios" [value]="pow.id">
                {{ pow.name }}
              </option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button
          *ngIf="model.idrow != 0"
          class="btn btn-danger btn-sm mr-auto"
          (click)="DelGrupo()"
        >
          Borrar grupo
        </button>
        <button
          class="btn btn-secondary btn-sm"
          (click)="staticModalAdd.hide()"
        >
          Cerrar
        </button>
        <button class="btn btn-secondary btn-sm" (click)="Update()">
          {{ model.idrow == 0 ? "Crear" : "Actualizar" }}
        </button>
      </div>
    </div>
  </div>
</div>

<div
  class="modal fade"
  bsModal
  #staticModalAsignar="bs-modal"
  tabindex="-1"
  role="dialog"
  aria-labelledby="myModalLabel"
  aria-hidden="true"
  id="docModalAsignar"
>
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-body">
        <label>Asignar {{ asignar.total }} tejido(s) al grupo</label>
        <select
          class="form-control form-control-sm"
          [(ngModel)]="asignar.idgrupo"
          [ngModelOptions]="{ standalone: true }"
        >
          <option [ngValue]="0">— Seleccionar grupo —</option>
          <option *ngFor="let g of grupos" [ngValue]="g.idrow">
            {{ g.grupo }} - {{ g.descripcion }} (criterio {{ g.criterio }})
          </option>
        </select>
        <small *ngIf="asignar.conOtroGrupo > 0" class="text-warning d-block mt-2">
          {{ asignar.conOtroGrupo }} de los tejidos seleccionados ya tienen grupo:
          se moverán al nuevo grupo (un tejido solo puede estar en un grupo).
        </small>
      </div>
      <div class="modal-footer">
        <button
          class="btn btn-secondary btn-sm"
          (click)="staticModalAsignar.hide()"
        >
          Cerrar
        </button>
        <button class="btn btn-secondary btn-sm" (click)="UpdateAsignar()">
          Asignar
        </button>
      </div>
    </div>
  </div>
</div>
