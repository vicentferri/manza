<div class="animated fadeIn">
  <div class="container-fluid">
    <div class="card card-block">
      <div class="container-overview panel">
        <h6>
          <i class="icon-list mt-1"></i>
          &nbsp;Correlación de Artículos de CortinaDecor para Fabricación
        </h6>

        <hr />
      </div>

      <div class="row">
        <div class="form-group col-2">
          <label>Nuevo Atributo</label>
          <input
            class="form-control form-control-sm"
            [(ngModel)]="newatributo.atributo"
          />
        </div>
        <div class="form-group col-2">
          <label>Nuevo Valor</label>
          <input
            class="form-control form-control-sm"
            [(ngModel)]="newatributo.valor"
          />
        </div>
        <div class="form-group col-2">
          <label>&nbsp;</label>
          <button
            class="btn btn-default btn-primary btn-block btn-sm"
            (click)="AddAtributo()"
          >
            Agregar Nuevo Atributo
          </button>
        </div>
      </div>

      <div class="row">
        <div class="form-group col col-2" [hidden]="!model.campo1_show">
          <label form="Tipo">{{ model.campo1 }}</label>
          <select
            class="form-control form-control-sm"
            id="campo1"
            [(ngModel)]="model.campo1_value"
            [ngModelOptions]="{ standalone: true }"
            (change)="ChangeValue1($event)"
          >
            <option *ngFor="let pow of campos1_tipo" [value]="pow.idrow">
              {{ pow.descripcion }}
            </option>
          </select>
        </div>
        <div class="form-group col-2">
          <label>Propiedad</label>
          <input
            class="form-control form-control-sm"
            [(ngModel)]="newmodel.propiedad"
          />
        </div>
        <div class="form-group col-2">
          <label>&nbsp;</label>
          <button
            class="btn btn-default btn-primary btn-block btn-sm"
            (click)="AddItem()"
          >
            Agregar Propiedad al Atributo
          </button>
        </div>
      </div>

      <div class="row">
        <div class="form-group col-xs-12 col-md-12 col-lg-12">
          <div style="height: 600px; overflow: auto">
            <div>
              <strong>{{ details_tipo.length }} Artículos</strong>
            </div>
            <div class="table-responsive">
              <table
                class="table table-striped table-hover table-bordered table-condensed borderless"
              >
                <thead class="thead-inverse">
                  <tr>
                    <th></th>
                    <th>Valor</th>
                    <th></th>
                    <th>Artículo</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let item of details_tipo">
                    <td style="width: 75px">
                      <button
                        class="btn btn-default btn-primary-outline btn-block btn-sm"
                        (click)="EditItem(item)"
                      >
                        Actualizar Valor
                      </button>
                    </td>
                    <td style="width: 250px">
                      <input
                        class="form-control form-control-sm"
                        [(ngModel)]="item.valor"
                      />
                    </td>
                    <td style="width: 75px">
                      <button
                        class="btn btn-default btn-primary-outline btn-block btn-sm"
                        (click)="AssignItem(item)"
                      >
                        Asignar Artículo
                      </button>
                    </td>
                    <td style="width: 250px">{{ item.articulos }}</td>
                    <td style="width: 75px">
                      <button
                        class="btn btn-default btn-primary-outline btn-block btn-sm"
                        (click)="DelItem(item)"
                      >
                        Borrar Linea
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div
  class="modal fade"
  bsModal
  #staticModalAdd="bs-modal"
  tabindex="-1"
  role="dialog"
  aria-labelledby="myModalLabel"
  aria-hidden="true"
  id="docModalDet"
>
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-body">
        <search-artikel [editable]="0" #SearchArtikel></search-artikel>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary btn-sm" (click)="staticModalAdd.hide()">
          Cerrar
        </button>
        <button class="btn btn-primary btn-sm" (click)="Update()">
          Asignar Artículos
        </button>
      </div>
    </div>
  </div>
</div>
