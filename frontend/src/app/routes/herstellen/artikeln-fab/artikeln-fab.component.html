<div class="container-fluid">
  <div class="card">
    <div class="card-header">
      <h5>
        <i class="icon-list mt-1"></i>
        &nbsp;Configuración de Artículos Valoración-Fabricación
      </h5>
    </div>

    <div class="card-body card-block">
      <div class="row mt-2">
        <div class="form-group col-xs-3 col-md-3 col-lg-3">
          <label form="Tipo">Tipo de Artículo</label>
          <select
            class="form-control form-control-sm"
            id="familia"
            required
            [(ngModel)]="model.tipo"
            [ngModelOptions]="{ standalone: true }"
            (change)="ChangeTipo($event)"
          >
            <option *ngFor="let pow of articulos_tipo" [value]="pow.idrow">
              {{ pow.descripcion }}
            </option>
          </select>
        </div>

        <div
          class="form-group col-xs-4 col-md-4 col-lg-4"
          [hidden]="!model.campo1_show"
        >
          <label form="Tipo">{{ model.campo1 }}</label>
          <select
            class="form-control form-control-sm"
            id="campo1"
            [(ngModel)]="model.campo1_value"
            [ngModelOptions]="{ standalone: true }"
            (change)="ChangeValue1($event)"
          >
            <option *ngFor="let pow of campos1_tipo" [value]="pow.idrow">
              {{ pow.descripcion }}
            </option>
          </select>
        </div>
        <div
          class="form-group col-xs-3 col-md-3 col-lg-3"
          [hidden]="!model.campo2_show"
        >
          <label form="Tipo">{{ model.campo2 }}</label>
          <select
            class="form-control form-control-sm"
            id="campo2"
            [(ngModel)]="model.campo2_value"
            [ngModelOptions]="{ standalone: true }"
            (change)="ChangeValue2($event)"
          >
            <option *ngFor="let pow of campos2_tipo" [value]="pow.idrow">
              {{ pow.descripcion }}
            </option>
          </select>
        </div>
        <div class="form-group col-xs-2 col-md-2 col-lg-2 mt-4">
          <button class="btn btn-secondary btn-sm" (click)="Open(1)">
            Artículos
          </button>
        </div>
      </div>

      <div class="row">
        <div class="form-group col-xs-12 col-md-12 col-lg-12">
          <div style="height: 650px; overflow: auto">
            <jqxGrid
              #gridReference
              [auto-create]="false"
              (onCellclick)="Cellclick($event)"
              (onCellbeginedit)="cellBeginEditEvent($event)"
              (onCellendedit)="cellEndEditEvent($event)"
            ></jqxGrid>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div
  class="modal fade"
  bsModal
  #staticModalAdd="bs-modal"
  tabindex="-1"
  role="dialog"
  aria-labelledby="myModalLabel"
  aria-hidden="true"
  id="docModalDet"
>
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-body">
        <search-artikel [editable]="0" #SearchArtikel></search-artikel>
      </div>
      <div class="modal-footer">
        <button
          class="btn btn-secondary btn-sm"
          (click)="staticModalAdd.hide()"
        >
          Cerrar
        </button>
        <button class="btn btn-secondary btn-sm" (click)="Update()">
          Asignar Artículos
        </button>
      </div>
    </div>
  </div>
</div>
