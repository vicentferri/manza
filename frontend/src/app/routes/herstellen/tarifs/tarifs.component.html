<div class="animated fadeIn">
  <div class="container-fluid">
    <div class="card card-block">
      <div class="container-overview panel">
        <h6>
          <span class="glyphicons glyphicons-shopping-cart"></span> &nbsp;<b
            >Configurador de Tarifa</b
          >
          <div class="pull-right">
            <haru-btn-general
              (Event_New)="New()"
              (Event_Search)="Search()"
              (Event_Delete)="Delete()"
              (Event_Save)="Save()"
            >
            </haru-btn-general>
          </div>
          <hr />
        </h6>
      </div>

      <form #iForm="ngForm">
        <div class="row">
          <div class="form-group col-xs-2 col-md-2 col-lg-2">
            <label>Número</label>
            <div class="input-group">
              <input
                type="text"
                class="form-control"
                [ngModelOptions]="{ standalone: true }"
                [(ngModel)]="model.numero"
              />
            </div>
          </div>
          <div class="form-group col-xs-2 col-md-2 col-lg-2">
            <label>Fecha</label>
            <input
              type="date"
              class="form-control"
              [ngModelOptions]="{ standalone: true }"
              [ngModel]="model.fecha | date : 'yyyy-MM-dd'"
              (change)="onDateChange($event, $event)"
            />
          </div>

          <div class="form-group col-xs-8 col-md-8 col-lg-8">
            <label>Descripción</label>
            <input
              type="textarea"
              class="form-control"
              [ngModelOptions]="{ standalone: true }"
              [(ngModel)]="model.observaciones"
            />
          </div>
        </div>

        <div class="row">
          <div class="form-group col-xs-2 col-md-2 col-lg-2">
            <label form="cliente">Clientes</label>
            <select
              name="Cliente"
              class="form-control"
              [ngModelOptions]="{ standalone: true }"
              [(ngModel)]="search.Cliente"
              (change)="ChangeCliente($event)"
            >
              <option *ngFor="let pow of lista_clientes" [value]="pow.id2">
                {{ pow.label }}
              </option>
            </select>
          </div>

          <div class="form-group col-xs-2 col-md-2 col-lg-2">
            <label form="producto">Producto</label>
            <select
              name="Cliente"
              class="form-control"
              [ngModelOptions]="{ standalone: true }"
              [(ngModel)]="search.Producto"
              (change)="ChangeProducto($event)"
            >
              <option *ngFor="let pow of lista_productos" [value]="pow.id">
                {{ pow.name }}
              </option>
            </select>
          </div>

          <div class="form-group col-xs-4 col-md-4 col-lg-4">
            <label form="tipotarifa">Rango de Dimensiones</label>
            <select
              name="tipotarifa"
              class="form-control"
              [ngModelOptions]="{ standalone: true }"
              [(ngModel)]="search.TipoT"
            >
              <option *ngFor="let pow of lista_tipos" [value]="pow.id">
                {{ pow.name }}
              </option>
            </select>
          </div>

          <div class="form-group col-xs-2 col-md-2 col-lg-2">
            <label form="impresion">Impresión digital</label>
            <select
              name="Impresion"
              class="form-control"
              [ngModelOptions]="{ standalone: true }"
              [(ngModel)]="search.Impresion"
            >
              <option *ngFor="let pow of lista_impresion" [value]="pow.id">
                {{ pow.name }}
              </option>
            </select>
          </div>
        </div>

        <div class="row" *ngIf="search.Producto == 1 || search.Producto == 3">
          <div class="form-group col col-2">
            <label form="tipo">Accionamientos</label>
            <select
              name="Accionamientos"
              class="form-control"
              [ngModelOptions]="{ standalone: true }"
              [(ngModel)]="search.Tipo"
              (change)="ChangeTipo($event)"
            >
              <option *ngFor="let pow of lista_accionamientos" [value]="pow.id">
                {{ pow.name }}
              </option>
            </select>
          </div>
          <div class="form-group col col-2">
            <label form="marca">Marcas Accionamiento</label>
            <select
              name="Marcas"
              class="form-control"
              [ngModelOptions]="{ standalone: true }"
              [(ngModel)]="search.Marca"
              (change)="CargaModelos()"
            >
              <option *ngFor="let pow of lista_marcas" [value]="pow.id">
                {{ pow.name }}
              </option>
            </select>
          </div>

          <div class="form-group col col-2" *ngIf="search.Tipo == 3">
            <label form="modelo">Modelos Accionamiento</label>
            <select
              name="Modelos"
              class="form-control"
              [ngModelOptions]="{ standalone: true }"
              [(ngModel)]="search.Modelo"
            >
              <option *ngFor="let pow of lista_modelos" [value]="pow.idrow">
                {{ pow.tipo }}
              </option>
            </select>
          </div>

          <div class="form-group col-xs-3 col-md-3 col-lg-3">
            <label form="tejido">Tejidos</label>
            <select
              name="Tejidos"
              class="form-control"
              [ngModelOptions]="{ standalone: true }"
              [(ngModel)]="search.Tejido"
            >
              <option *ngFor="let pow of lista_tejidos" [value]="pow.id">
                {{ pow.name }}
              </option>
            </select>
          </div>

          <div class="form-group col-xs-2 col-md-2 col-lg-2">
            <label form="tubo">Tubos</label>
            <select
              name="Tubos"
              class="form-control"
              [ngModelOptions]="{ standalone: true }"
              [(ngModel)]="search.Tubo"
            >
              <option *ngFor="let pow of lista_tubos" [value]="pow.id">
                {{ pow.name }}
              </option>
            </select>
          </div>
        </div>

        <div class="row" *ngIf="search.Producto == 2">
          <div class="form-group col-xs-3 col-md-3 col-lg-3">
            <label form="tejido">Tejidos</label>
            <select
              name="Tejidos"
              class="form-control form-control-sm"
              [ngModelOptions]="{ standalone: true }"
              [(ngModel)]="search.Tejido"
            >
              <option *ngFor="let pow of lista_tejidos" [value]="pow.id">
                {{ pow.name }}
              </option>
            </select>
          </div>
        </div>

        <div class="row" *ngIf="search.Producto == 3">
          <div class="form-group col-xs-3 col-md-3 col-lg-3">
            <label form="tejido">Tejidos</label>
            <select
              name="Tejidos"
              class="form-control"
              [ngModelOptions]="{ standalone: true }"
              [(ngModel)]="search.Tejido"
            >
              <option *ngFor="let pow of lista_tejidos" [value]="pow.id">
                {{ pow.name }}
              </option>
            </select>
          </div>

          <div class="form-group col-xs-3 col-md-3 col-lg-3">
            <label form="ancholama">Ancho de Lama</label>
            <select
              name="ancholama"
              class="form-control"
              [ngModelOptions]="{ standalone: true }"
              [(ngModel)]="search.AnchoLama"
            >
              <option *ngFor="let pow of lista_anchoslama" [value]="pow.id">
                {{ pow.name }}
              </option>
            </select>
          </div>
        </div>

        <div class="row" *ngIf="search.Producto == 4">
          <div class="form-group col-xs-3 col-md-3 col-lg-3">
            <label form="tejido">Tejidos</label>
            <select
              name="Tejidos"
              class="form-control"
              [ngModelOptions]="{ standalone: true }"
              [(ngModel)]="search.Tejido"
            >
              <option *ngFor="let pow of lista_tejidos" [value]="pow.id">
                {{ pow.name }}
              </option>
            </select>
          </div>
        </div>

        <div class="row" *ngIf="search.Producto == 6">
          <div class="form-group col-xs-3 col-md-3 col-lg-3">
            <label form="cajones">Cajón</label>
            <select
              name="Cajones"
              class="form-control form-control-sm"
              [ngModelOptions]="{ standalone: true }"
              [(ngModel)]="search.Cajon"
            >
              <option *ngFor="let pow of lista_cajones" [value]="pow.idrow">
                {{ pow.descripcion }}
              </option>
            </select>
          </div>
          <div class="form-group col-xs-2 col-md-2 col-lg-2">
            <label form="lacado">Tipo de Lacado</label>
            <select
              name="Lacado"
              class="form-control form-control-sm"
              [ngModelOptions]="{ standalone: true }"
              [(ngModel)]="search.Lacado"
            >
              <option *ngFor="let pow of lista_lacados" [value]="pow.id">
                {{ pow.name }}
              </option>
            </select>
          </div>
          <div class="form-group col-xs-3 col-md-3 col-lg-3">
            <label form="tejido">Tejidos</label>
            <select
              name="Tejidos"
              class="form-control form-control-sm"
              [ngModelOptions]="{ standalone: true }"
              [(ngModel)]="search.Tejido"
            >
              <option *ngFor="let pow of lista_tejidos" [value]="pow.id">
                {{ pow.name }}
              </option>
            </select>
          </div>
        </div>

        <div class="row" *ngIf="model.id > 0">
          <div class="col col-12">
            <div class="row">
              <div class="form-group col col-1">
                <label>Coef.Promoción</label>
                <div class="input-group">
                  <input
                    type="number"
                    class="form-control"
                    [ngModelOptions]="{ standalone: true }"
                    [(ngModel)]="model.promocion_coeficiente"
                  />
                  <span class="input-group-btn"> </span>
                </div>
              </div>
              <div class="form-group col col-1">
                <label>Promoción Activa</label><br />
                <label
                  class="switch switch-text switch-pill switch-lg switch-primary"
                >
                  <input
                    type="checkbox"
                    class="switch-input"
                    [(ngModel)]="model.promocion_activa"
                    [ngModelOptions]="{ standalone: true }"
                  />
                  <span class="switch-label" data-on="SI" data-off="NO"></span>
                  <span class="switch-handle"></span>
                </label>
              </div>
              <div class="form-group col col-1">
                <label>Modifica PVP</label><br />
                <label
                  class="switch switch-text switch-pill switch-lg switch-primary"
                >
                  <input
                    type="checkbox"
                    class="switch-input"
                    [(ngModel)]="model.promocion_modificapvp"
                    [ngModelOptions]="{ standalone: true }"
                  />
                  <span class="switch-label" data-on="SI" data-off="NO"></span>
                  <span class="switch-handle"></span>
                </label>
              </div>
              <div class="form-group col col-1">
                <label>Modifica C1</label><br />
                <label
                  class="switch switch-text switch-pill switch-lg switch-primary"
                >
                  <input
                    type="checkbox"
                    class="switch-input"
                    [(ngModel)]="model.promocion_modificapvc"
                    [ngModelOptions]="{ standalone: true }"
                  />
                  <span class="switch-label" data-on="SI" data-off="NO"></span>
                  <span class="switch-handle"></span>
                </label>
              </div>
              <div class="form-group col col-2">
                <label>PVP desde C1</label>
                <div class="input-group">
                  <input
                    type="number"
                    class="form-control"
                    [ngModelOptions]="{ standalone: true }"
                    [(ngModel)]="model.coeficiente"
                  />
                  <span class="input-group-btn">
                    <button
                      class="btn btn-secondary"
                      type="button"
                      (click)="Regenerate()"
                    >
                      Generar
                    </button>
                  </span>
                </div>
              </div>
              <div class="form-group col col-2">
                <label>C1 desde PVP</label>
                <div class="input-group">
                  <input
                    type="number"
                    class="form-control"
                    [ngModelOptions]="{ standalone: true }"
                    [(ngModel)]="model.coeficiente"
                  />
                  <span class="input-group-btn">
                    <button
                      class="btn btn-secondary"
                      type="button"
                      (click)="Regenerate2()"
                    >
                      Generar
                    </button>
                  </span>
                </div>
              </div>
              <div class="form-group col col-4">
                <div class="mt-3">
                  <button class="btn btn-secondary" (click)="DeleteLines()">
                    &nbsp;&nbsp;Borrar Lineas de Tarifa
                  </button>
                  <button
                    class="btn btn-secondary"
                    (click)="staticModal3.show()"
                  >
                    &nbsp;&nbsp;Importar Lineas de Tarifa
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </form>

      <div class="row mt-4">
        <div class="form-group col-xs-12 col-md-12 col-lg-12">
          <div style="overflow: auto; width: 100%; height: 850px">
            <table class="table table-responsive table-bordered">
              <tr *ngFor="let row of MapList">
                <td *ngFor="let cell of row.c" class="{{ cell.cl }}">
                  <div *ngIf="cell.t == 'rw'">
                    <input type="number" class="TEdit" [(ngModel)]="cell.v1" />
                    <input type="text" class="TEdit" [(ngModel)]="cell.v2" />
                  </div>
                  <div *ngIf="cell.t != 'rw'">
                    {{ cell.v1 }}
                  </div>
                </td>
              </tr>
            </table>
          </div>
        </div>
      </div>

      <div
        class="row"
        style="border: solid; height: 100px"
        (paste)="data($event)"
      >
        paste area
        <div>{{ val }}</div>
      </div>
    </div>
  </div>
</div>

<div
  class="modal fade"
  bsModal
  #staticModal3="bs-modal"
  tabindex="-1"
  role="dialog"
  aria-labelledby="myModalLabel"
  aria-hidden="true"
  id="docModal3"
>
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header bg-primary">
        <h4 class="modal-title pull-left">Importar Tarifa desde Excel</h4>
        <button
          type="button"
          class="close pull-right"
          aria-label="Close"
          (click)="staticModal3.hide()"
        >
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <label><b>Seleccionar Fichero a Importar</b></label>
        <input
          type="file"
          placeholder="Subir Imagen"
          (change)="fileChangeEvent($event)"
        />
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-primary"
          (click)="staticModal3.hide()"
        >
          Cerrar
        </button>
      </div>
    </div>
  </div>
</div>
