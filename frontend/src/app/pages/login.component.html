<div class="app flex-row align-items-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-11 col-sm-8 col-md-6 col-lg-5" style="max-width: 440px;">
        <div class="card-group mb-0">
          <div class="card p-4">
            <div class="text-center py-2 mb-2">
              <img
                alt="ManzaSM"
                src="/assets/img/logologin.png"
                style="max-width: 250px; width: 100%; height: auto;"
              />
            </div>

            <div class="card-block">
              <div class="text-center mb-3">
                <h3>Iniciar sesión</h3>
                <p class="text-muted">
                  Acceda a su cuenta indicando las credenciales
                </p>
              </div>

              <div class="mx-auto" style="max-width: 320px;">
                <div class="input-group mb-3">
                  <span class="input-group-addon"><i class="icon-user"></i></span>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="e-mail del Usuario"
                    [(ngModel)]="model.username"
                    #username="ngModel"
                    (keyup.enter)="Login()"
                    required
                  />
                </div>
                <div class="input-group mb-4">
                  <span class="input-group-addon"><i class="icon-lock"></i></span>
                  <input
                    type="password"
                    class="form-control"
                    placeholder="Password"
                    [(ngModel)]="model.password"
                    #password="ngModel"
                    (keyup.enter)="Login()"
                    required
                  />
                </div>
                <div class="row">
                  <div class="col-12 text-right">
                    <button
                      type="button"
                      class="btn btn-secondary px-4"
                      (click)="Login()"
                    >
                      Acceder
                    </button>
                  </div>
                </div>

                <div class="alert alert-danger mt-3 text-center" *ngIf="success == 0">
                  No Tiene Autorización para acceder
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
