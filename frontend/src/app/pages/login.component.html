<div class="login">

  <!-- Panel de marca -->
  <section class="login-marca">
    <span class="forma forma-gris"></span>
    <span class="forma forma-azul"></span>

    <div class="logo-manza">
      <svg viewBox="0 0 26 36" aria-hidden="true">
        <polygon points="0,0 26,0 26,13 0,20" fill="#ffffff" />
        <polygon points="0,20 26,13 26,30 0,36" fill="#a8d4f0" />
      </svg>
      <span>Manza<b>SM</b></span>
    </div>

    <div class="brand-claim">
      <h2 class="brand-title"><span class="sm">SM</span><span class="tecnica">TÉCNICA</span></h2>
      <p class="brand-tagline">Pasión por la cortina</p>
    </div>

    <small class="copyright">© {{ anio }} ManzaSM</small>
  </section>

  <!-- Formulario -->
  <section class="login-form">
    <form class="caja" (ngSubmit)="Login()" autocomplete="on">
      <h1>Bienvenido de nuevo</h1>
      <p class="subtitulo">Inicie sesión con su correo y contraseña</p>

      <label for="usuario">Correo electrónico</label>
      <input
        id="usuario"
        name="username"
        type="text"
        autocomplete="username"
        placeholder="nombre@empresa.com"
        [(ngModel)]="model.username"
        #username="ngModel"
        required
      />

      <label for="clave">Contraseña</label>
      <div class="clave">
        <input
          id="clave"
          name="password"
          [type]="verClave ? 'text' : 'password'"
          autocomplete="current-password"
          placeholder="••••••••"
          [(ngModel)]="model.password"
          #password="ngModel"
          required
        />
        <button type="button" class="ojo" (click)="verClave = !verClave"
          [attr.aria-label]="verClave ? 'Ocultar contraseña' : 'Mostrar contraseña'">
          <i class="fa-regular" [class.fa-eye]="!verClave" [class.fa-eye-slash]="verClave"></i>
        </button>
      </div>

      <button type="submit" class="acceder" [disabled]="loading">
        <ng-container *ngIf="!loading">Acceder <i class="fa-solid fa-arrow-right"></i></ng-container>
        <ng-container *ngIf="loading">Accediendo…</ng-container>
      </button>

      <div class="error" *ngIf="success == 0">
        <i class="fa-solid fa-circle-exclamation"></i>
        No tiene autorización para acceder. Revise el correo y la contraseña.
      </div>
    </form>
  </section>

</div>
