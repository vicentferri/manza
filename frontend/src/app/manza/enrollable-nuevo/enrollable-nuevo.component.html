<div class="enx">
   <div class="enx-aviso">
      <i class="fa fa-flask"></i>
      Configurador nuevo de accionamientos: de momento sin precio y solo enrollables en la cesta.
   </div>

   <!-- MEDIDAS -->
   <div class="enx-seccion">
      <div class="enx-titulo">1. Medidas</div>
      <div class="row">
         <div class="col-md-3 col-6 form-group">
            <label>{{ "ANCHO" | translate }} (cm)</label>
            <input type="number" class="form-control form-control-sm" min="1" [(ngModel)]="ancho" [ngModelOptions]="{ standalone: true }" />
         </div>
         <div class="col-md-3 col-6 form-group">
            <label>{{ "ALTO" | translate }} (cm)</label>
            <input type="number" class="form-control form-control-sm" min="1" [(ngModel)]="alto" [ngModelOptions]="{ standalone: true }" />
         </div>
         <div class="col-md-2 col-6 form-group">
            <label>{{ "CANTIDAD" | translate }}</label>
            <input type="number" class="form-control form-control-sm" min="1" [(ngModel)]="cantidad" [ngModelOptions]="{ standalone: true }" />
         </div>
      </div>
   </div>

   <!-- TEJIDO -->
   <div class="enx-seccion">
      <div class="enx-titulo">2. Tejido</div>
      <div class="row">
         <div class="col-md-3 col-6 form-group">
            <label>{{ "TIPO DE TEJIDO" | translate }}</label>
            <select class="form-control form-control-sm" [(ngModel)]="opacidad" [ngModelOptions]="{ standalone: true }" (change)="cambiarOpacidad()">
               <option *ngFor="let o of tiposTejido" [value]="o">{{ o }}</option>
            </select>
         </div>
         <div class="col-md-3 col-6 form-group">
            <label>{{ "SERIE" | translate }}</label>
            <select class="form-control form-control-sm" [(ngModel)]="tejido" [ngModelOptions]="{ standalone: true }" (change)="cambiarTejido()">
               <option value="-1">Seleccionar</option>
               <option *ngFor="let t of tejidos" [value]="t.id">{{ t.text }}</option>
            </select>
         </div>
         <div class="col-md-3 col-6 form-group">
            <label>{{ "COLOR" | translate }}</label>
            <select class="form-control form-control-sm" [(ngModel)]="tejidoColor" [ngModelOptions]="{ standalone: true }" [disabled]="tejidosC.length === 0">
               <option value="-1">Seleccionar</option>
               <option *ngFor="let c of tejidosC" [value]="c.id">{{ c.text }}</option>
            </select>
         </div>
         <div class="col-md-3 col-6 form-group">
            <label>{{ "SALIDA" | translate }}</label>
            <select class="form-control form-control-sm" [(ngModel)]="salida" [ngModelOptions]="{ standalone: true }">
               <option *ngFor="let s of salidas" [value]="s.id">{{ s.text }}</option>
            </select>
         </div>
      </div>
   </div>

   <!-- ACCIONAMIENTO (modelo nuevo) -->
   <div class="enx-seccion">
      <div class="enx-titulo">3. Accionamiento</div>

      <div *ngIf="cargando" class="text-muted small"><i class="fa fa-spinner fa-spin"></i> Cargando opciones...</div>
      <div *ngIf="!cargando && !opc" class="enx-error">No se han podido cargar las opciones de accionamiento.</div>

      <ng-container *ngIf="opc">
         <div class="row">
            <div class="col-md-3 col-6 form-group">
               <label>Accionamiento</label>
               <select class="form-control form-control-sm" [(ngModel)]="sel.accionamiento" [ngModelOptions]="{ standalone: true }" (change)="cambiar('accionamiento')">
                  <option value="">Seleccionar</option>
                  <option *ngFor="let a of accionamientos" [value]="a.id">{{ a.nombre }}</option>
               </select>
            </div>
            <div class="col-md-3 col-6 form-group" *ngIf="sel.accionamiento">
               <label>Sistema</label>
               <select class="form-control form-control-sm" [(ngModel)]="sel.sistema" [ngModelOptions]="{ standalone: true }" (change)="cambiar('sistema')">
                  <option value="">Seleccionar</option>
                  <option *ngFor="let s of sistemas" [value]="s.id">{{ s.nombre }}</option>
               </select>
               <small *ngIf="sistemas.length === 0" class="enx-error">Este accionamiento no tiene sistemas asignados.</small>
            </div>
         </div>

         <!-- CADENA -->
         <div class="row" *ngIf="esCadena && sel.sistema">
            <div class="col-md-3 col-6 form-group">
               <label>Tipo de cadena</label>
               <select class="form-control form-control-sm" [(ngModel)]="sel.tipo_cadena" [ngModelOptions]="{ standalone: true }" (change)="cambiar('tipo_cadena')">
                  <option value="">Seleccionar</option>
                  <option *ngFor="let t of tiposCadena" [value]="t.id">{{ t.nombre }}</option>
               </select>
            </div>
            <ng-container *ngIf="esAro">
               <div class="col-md-3 col-6 form-group">
                  <label>Tipo de aro</label>
                  <select class="form-control form-control-sm" [(ngModel)]="sel.tipo_aro" [ngModelOptions]="{ standalone: true }" (change)="cambiar('tipo_aro')">
                     <option value="">Seleccionar</option>
                     <option *ngFor="let a of aros" [value]="a.id">{{ a.nombre }}</option>
                  </select>
               </div>
               <div class="col-md-3 col-6 form-group">
                  <label>Altura</label>
                  <select class="form-control form-control-sm" [(ngModel)]="sel.altura" [ngModelOptions]="{ standalone: true }" (change)="cambiar('altura')">
                     <option value="">Seleccionar</option>
                     <option *ngFor="let a of alturas" [value]="a.id">{{ etiquetaAltura(a) }}</option>
                  </select>
               </div>
            </ng-container>
            <div class="col-md-3 col-6 form-group" *ngIf="esMedida">
               <label>Tipo de cadena a medida</label>
               <select class="form-control form-control-sm" [(ngModel)]="sel.cadena_medida" [ngModelOptions]="{ standalone: true }" (change)="cambiar('cadena_medida')">
                  <option value="">Seleccionar</option>
                  <option *ngFor="let m of medidas" [value]="m.id">{{ m.nombre }}</option>
               </select>
            </div>
            <div class="col-md-3 col-6 form-group" *ngIf="sel.tipo_cadena && coloresCadena.length > 0">
               <label>Color de cadena</label>
               <select class="form-control form-control-sm" [(ngModel)]="sel.color_cadena" [ngModelOptions]="{ standalone: true }" (change)="cambiar('color_cadena')">
                  <option value="">Seleccionar</option>
                  <option *ngFor="let c of coloresCadena" [value]="c.id">{{ c.nombre }}</option>
               </select>
            </div>
         </div>

         <!-- MOTOR -->
         <div class="row" *ngIf="esMotor && sel.sistema">
            <div class="col-md-3 col-6 form-group">
               <label>Tipo de motor</label>
               <select class="form-control form-control-sm" [(ngModel)]="sel.tipo_motor" [ngModelOptions]="{ standalone: true }" (change)="cambiar('tipo_motor')">
                  <option value="">Seleccionar</option>
                  <option *ngFor="let t of tiposMotor" [value]="t.id">{{ t.nombre }}</option>
               </select>
               <small *ngIf="tiposMotor.length === 0" class="enx-error">Ningún tipo de motor admite este sistema.</small>
            </div>
            <div class="col-md-3 col-6 form-group" *ngIf="sel.tipo_motor">
               <label>Modelo</label>
               <select class="form-control form-control-sm" [(ngModel)]="sel.modelo_motor" [ngModelOptions]="{ standalone: true }" (change)="cambiar('modelo_motor')">
                  <option value="">Seleccionar</option>
                  <option *ngFor="let m of modelos" [value]="m.id">{{ m.nombre }}</option>
               </select>
            </div>
            <div class="col-md-2 col-6 form-group" *ngIf="sel.modelo_motor && mandos.length > 0">
               <label>Mando</label>
               <select class="form-control form-control-sm" [(ngModel)]="sel.mando" [ngModelOptions]="{ standalone: true }">
                  <option value="">Sin mando</option>
                  <option *ngFor="let m of mandos" [value]="m.id">{{ m.nombre }}</option>
               </select>
            </div>
            <div class="col-md-2 col-6 form-group" *ngIf="sel.modelo_motor && cargadores.length > 0">
               <label>Cargador</label>
               <select class="form-control form-control-sm" [(ngModel)]="sel.cargador" [ngModelOptions]="{ standalone: true }">
                  <option value="">Sin cargador</option>
                  <option *ngFor="let c of cargadores" [value]="c.id">{{ c.nombre }}</option>
               </select>
            </div>
            <div class="col-md-2 col-6 form-group" *ngIf="sel.modelo_motor && baterias.length > 0">
               <label>Batería</label>
               <select class="form-control form-control-sm" [(ngModel)]="sel.bateria" [ngModelOptions]="{ standalone: true }">
                  <option value="">Sin batería</option>
                  <option *ngFor="let b of baterias" [value]="b.id">{{ b.nombre }}</option>
               </select>
            </div>
         </div>
      </ng-container>
   </div>

   <!-- OBSERVACIONES Y AÑADIR -->
   <div class="enx-seccion">
      <div class="row align-items-end">
         <div class="col-md-8 form-group">
            <label>Observaciones</label>
            <input type="text" class="form-control form-control-sm" maxlength="250" [(ngModel)]="instrucciones" [ngModelOptions]="{ standalone: true }" />
         </div>
         <div class="col-md-4 form-group text-right">
            <button type="button" class="btn btn-success" (click)="Agregar()">
               <i class="fa fa-plus"></i> {{ "AGREGAR" | translate }}
            </button>
         </div>
      </div>
   </div>
</div>
